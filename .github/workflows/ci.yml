name: CI

# Everything that gates a merge. Pre-commit, Detect changed files, Build and
# test and Fuzz are blairham/.github's go-ci.yml, shared with every Go
# repository there; their checks report as `CI / <job>`. `Vet examples` is
# tuikit's own: it `needs: ci` and gates its *steps* on
# `needs.ci.outputs.code` (never a job-level `if:` or a `paths:` filter: a
# required check that never runs is pending forever).
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    # A squash merge lands a tree no pull request ever built — the branch was
    # tested before the squash, and `main` may have moved under it since — so
    # the merge result gets its own run rather than inheriting the branch's
    # green tick.
    branches: [main]
  schedule:
    # Weekly, for go-ci.yml's Fuzz job, which explores on main and on this
    # schedule but never on a pull request.
    - cron: '17 5 * * 3'

permissions:
  contents: read

concurrency:
  # A superseded push is not worth finishing; only the newest commit matters.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    uses: blairham/.github/.github/workflows/go-ci.yml@99060d62d0693570a360127ab698307d276630da # v0.0.0

  examples:
    # The examples are documentation people copy, and a stale example is worse
    # than no example because it is copied before it is read. They are a
    # separate main package, so `go build ./...` in CI already covers them —
    # this runs them under `go vet` for the checks a build does not make.
    name: Vet examples
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.ci.outputs.code == 'true'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.ci.outputs.code == 'true'
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - run: go vet ./examples/...
        if: needs.ci.outputs.code == 'true'
